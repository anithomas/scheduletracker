name: Weekly Digest

on:
  schedule:
    # 8:00 AM EST (UTC-5) = 13:00 UTC — Sundays only. Same time-of-day as the
    # daily reminder job; see .github/workflows/reminders.yml.
    - cron: '0 13 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI (for testing)

jobs:
  send-weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Send weekly digest
        run: node weekly-digest.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: home-and-auto-tracker
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAYS_JSON: ${{ secrets.SMS_GATEWAYS_JSON }}
