name: Refresh Calendar Feeds

# Phase 4, F8 — the app is static GitHub Pages, so there's no per-request
# compute to generate a feed on demand: this workflow rebuilds and
# redeploys the whole site on a timer, purely so each member's .ics file
# reflects current Firestore data between code deploys (a code push to main
# already regenerates feeds as part of deploy-pages.yml — see that
# workflow's "Generate calendar feeds" step). A calendar app that polls a
# subscribed feed every few hours won't notice the gap between runs here.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI (for testing)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install reminder-script dependencies
        run: npm ci
        working-directory: scripts

      - name: Generate calendar feeds
        run: node generate-ics-feeds.js ../dist/feeds
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: home-and-auto-tracker

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
