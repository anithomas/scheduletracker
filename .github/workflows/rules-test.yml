name: Security rules tests

on:
  push:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/rules-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/rules/**'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - run: npm ci
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the tail of the output as one annotation (readable via the API/UI summary)
            msg=$(grep -vE '^\s*$' test-output.txt | tail -n 80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Rules tests failed::${msg}"
          fi
          exit $status
