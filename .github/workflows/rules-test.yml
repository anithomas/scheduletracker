name: Security rules tests

on:
  push:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/rules-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/rules/**'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - run: npm ci
      - run: npm test
