name: Build Android APK

# R6 (Phase 3): this used to run on every push to main, which meant every
# ordinary commit — a copy fix, a CSS tweak — spent several minutes building
# a full Android APK whether or not anyone needed one. The APK is only ever
# pulled off the Actions run manually anyway, so this now builds only when
# someone asks for it directly (workflow_dispatch) or on a version tag
# (push a `v*` tag to cut a release build), plus the one trigger that's hard
# to remember by hand: Android-only files changing (capacitor.config.json,
# this workflow itself).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # Phase 3 (R4): the web app is now a Vite build (TypeScript modules,
      # not one inline <script>) — the Android WebView needs the compiled
      # dist/ output, not the raw source files `cp`'d straight into www/.
      - name: Build web assets
        run: npm run build

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp -r dist/. www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTracker-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
